[package]
name = "session-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "session_core"
path = "src/lib.rs"

[[bin]]
name = "session-core"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
toml_edit = "0.22"
tempfile = "3"
url = "2.5"
zstd = "0.13"
