appId: com.openai.codex-status
productName: codex-status
directories:
  buildResources: build
files:
  - 'out/**/*'
  - 'package.json'
  - 'build/icon-*.png'
  - '!**/.vscode/*'
  - '!**/*.map'
  - '!**/*.{md,markdown,txt}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,.editorconfig}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.codegraph,.tmp-icons,.qoder,.git,.github}/**'
  - '!{design_refs,scripts,resources}/**'
  - '!node_modules/**/*.d.ts'
  - '!node_modules/**/{test,tests,__tests__,example,examples,doc,docs,license,LICENSE,CHANGELOG.md,README.md,readme.md}'
asarUnpack:
  - build/icon-*.png
win:
  executableName: codex-status
  icon: build/icon.ico
  compression: maximum
  electronLanguages:
    - zh-CN
    - en-US
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  icon: build/icon-1.png
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: Lele-bigLe
  repo: codex-status-line
